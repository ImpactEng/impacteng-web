<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>Who holds which credential, before and after</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#f8fafc"/>

  <!-- Before -->
  <text x="20" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1">BEFORE</text>
  <rect x="20" y="52" width="160" height="44" rx="8" fill="#e2e8f0"/>
  <text x="100" y="80" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="700">Me</text>
  <rect x="20" y="108" width="160" height="44" rx="8" fill="#e2e8f0"/>
  <text x="100" y="136" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="700">Agents</text>
  <rect x="20" y="164" width="160" height="56" rx="8" fill="#e2e8f0"/>
  <text x="100" y="187" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="700">CI workflows</text>
  <text x="100" y="206" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="700">started by either</text>

  <line x1="182" y1="74" x2="392" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="182" y1="130" x2="392" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="182" y1="192" x2="392" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="396" y="96" width="250" height="80" rx="10" fill="#475569"/>
  <text x="521" y="143" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">One GitHub login</text>
  <text x="521" y="206" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">The platform sees one actor</text>

  <line x1="20" y1="240" x2="740" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- After -->
  <text x="20" y="276" font-size="15" font-weight="700" fill="#2E86AB" letter-spacing="1">AFTER</text>

  <rect x="20" y="292" width="230" height="146" rx="10" fill="#1E3A5F"/>
  <text x="40" y="324" font-size="17" font-weight="700" fill="#ffffff">Me</text>
  <text x="40" y="354" font-size="14" fill="#e2e8f0">My login, behind a</text>
  <text x="40" y="374" font-size="14" fill="#e2e8f0">password manager</text>
  <text x="40" y="394" font-size="14" fill="#e2e8f0">and a fingerprint</text>

  <rect x="265" y="292" width="230" height="146" rx="10" fill="#1E3A5F"/>
  <text x="285" y="324" font-size="17" font-weight="700" fill="#ffffff">Agents</text>
  <text x="285" y="354" font-size="14" fill="#e2e8f0">Own name and signing key</text>
  <text x="285" y="374" font-size="14" fill="#e2e8f0">Read-only access</text>
  <text x="285" y="394" font-size="14" fill="#e2e8f0">Prepare branches</text>
  <text x="285" y="414" font-size="14" fill="#e2e8f0">No write credential</text>

  <rect x="510" y="292" width="230" height="146" rx="10" fill="#1E3A5F"/>
  <text x="530" y="324" font-size="17" font-weight="700" fill="#ffffff">CI</text>
  <text x="530" y="354" font-size="14" fill="#e2e8f0">Short-lived credentials</text>
  <text x="530" y="374" font-size="14" fill="#e2e8f0">where the provider</text>
  <text x="530" y="394" font-size="14" fill="#e2e8f0">offers them</text>
  <text x="530" y="414" font-size="14" fill="#e2e8f0">Deploy only</text>

  <text x="380" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#2E86AB">Agents prepare; I push and merge; CI deploys</text>
</svg>
