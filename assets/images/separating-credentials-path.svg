<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>The path from an agent's change to production</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E86AB"/></marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="760" height="498" fill="#f8fafc"/>

  <rect x="20" y="30" width="200" height="96" rx="10" fill="#1E3A5F"/>
  <text x="120" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">AI coding agents</text>
  <text x="120" y="90" text-anchor="middle" font-size="13" fill="#cbd5e1">Claude Code among them</text>
  <text x="120" y="108" text-anchor="middle" font-size="13" fill="#cbd5e1">prepare changes</text>

  <rect x="280" y="30" width="200" height="96" rx="10" fill="#1E3A5F"/>
  <text x="380" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Me</text>
  <text x="380" y="90" text-anchor="middle" font-size="13" fill="#cbd5e1">push, approve, merge</text>

  <rect x="540" y="30" width="200" height="96" rx="10" fill="#e8f1f8" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="560" y="60" font-size="16" font-weight="700" fill="#1E3A5F">Code</text>
  <text x="560" y="86" font-size="14" fill="#334155">GitHub</text>
  <text x="560" y="108" font-size="14" fill="#334155">A self-hosted Git forge</text>

  <line x1="222" y1="78" x2="276" y2="78" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="152" text-anchor="middle" font-size="12.5" fill="#334155">branches,</text>
  <text x="250" y="167" text-anchor="middle" font-size="12.5" fill="#334155">prepared locally</text>
  <line x1="250" y1="140" x2="250" y2="82" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

  <line x1="482" y1="78" x2="536" y2="78" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="52" text-anchor="middle" font-size="12.5" fill="#334155">push,</text>
  <text x="510" y="67" text-anchor="middle" font-size="12.5" fill="#334155">merge</text>

  <rect x="20" y="230" width="200" height="96" rx="10" fill="#e8f1f8" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="40" y="260" font-size="16" font-weight="700" fill="#1E3A5F">Secrets</text>
  <text x="40" y="286" font-size="14" fill="#334155">A password manager</text>

  <rect x="280" y="230" width="200" height="96" rx="10" fill="#1E3A5F"/>
  <text x="380" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">CI</text>
  <text x="380" y="290" text-anchor="middle" font-size="13" fill="#cbd5e1">continuous integration</text>
  <text x="380" y="308" text-anchor="middle" font-size="13" fill="#cbd5e1">does the deploying</text>

  <line x1="546" y1="128" x2="472" y2="226" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="458" y="222" font-size="12.5" fill="#334155" text-anchor="end">on merge</text>

  <line x1="380" y1="128" x2="380" y2="226" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gate)"/>
  <text x="392" y="168" font-size="12.5" font-weight="700" fill="#b45309">approves each</text>
  <text x="392" y="184" font-size="12.5" font-weight="700" fill="#b45309">production deploy</text>

  <line x1="222" y1="278" x2="276" y2="278" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="352" text-anchor="middle" font-size="12.5" fill="#334155">credentials</text>
  <line x1="250" y1="340" x2="250" y2="282" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

  <rect x="524" y="170" width="216" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="524" y="170" width="6" height="50" rx="3" fill="#f59e0b"/>
  <text x="540" y="191" font-size="15" font-weight="700" fill="#1E3A5F">AWS</text>
  <text x="540" y="210" font-size="12.5" fill="#475569">separate accounts by purpose</text>
  <rect x="524" y="228" width="216" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="524" y="228" width="6" height="50" rx="3" fill="#f97316"/>
  <text x="540" y="249" font-size="15" font-weight="700" fill="#1E3A5F">Cloudflare</text>
  <text x="540" y="268" font-size="12.5" fill="#475569">one account, a zone per domain</text>
  <rect x="524" y="286" width="216" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="524" y="286" width="6" height="50" rx="3" fill="#64748b"/>
  <text x="540" y="307" font-size="15" font-weight="700" fill="#1E3A5F">GitHub Pages</text>
  <text x="540" y="326" font-size="12.5" fill="#475569">a repository per site</text>
  <rect x="524" y="344" width="216" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="524" y="344" width="6" height="50" rx="3" fill="#22c55e"/>
  <text x="540" y="365" font-size="15" font-weight="700" fill="#1E3A5F">Google Apps Script</text>
  <text x="540" y="384" font-size="12.5" fill="#475569">a project per script</text>
  <rect x="524" y="402" width="216" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="632" y="426" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">…</text>
  <text x="632" y="464" text-anchor="middle" font-size="12.5" font-style="italic" fill="#475569">separate providers, each with</text>
  <text x="632" y="480" text-anchor="middle" font-size="12.5" font-style="italic" fill="#475569">its own idea of identity</text>

  <line x1="482" y1="262" x2="520" y2="195" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482" y1="272" x2="520" y2="253" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482" y1="282" x2="520" y2="311" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482" y1="292" x2="520" y2="369" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482" y1="302" x2="520" y2="420" stroke="#2E86AB" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="404" y="352" font-size="12.5" fill="#334155">deploy</text>
</svg>
