<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>The timeline of the change</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <line x1="60" y1="45" x2="60" y2="425" stroke="#2E86AB" stroke-width="3"/>

  <circle cx="60" cy="45" r="16" fill="#1E3A5F"/>
  <text x="60" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="95" y="51" font-size="16" fill="#1E3A5F" font-weight="700">One login did everything</text>

  <circle cx="60" cy="108" r="16" fill="#1E3A5F"/>
  <text x="60" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="95" y="114" font-size="16" fill="#1E3A5F" font-weight="700">Split the login</text>

  <circle cx="60" cy="171" r="16" fill="#1E3A5F"/>
  <text x="60" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="95" y="177" font-size="16" fill="#1E3A5F" font-weight="700">What broke: agents blind, my own access cut, SSH left open</text>

  <circle cx="60" cy="234" r="16" fill="#1E3A5F"/>
  <text x="60" y="239" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="95" y="240" font-size="16" fill="#1E3A5F" font-weight="700">Inventory and impact matrix; git guard v1, then v2</text>

  <circle cx="60" cy="297" r="16" fill="#1E3A5F"/>
  <text x="60" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="95" y="303" font-size="16" fill="#1E3A5F" font-weight="700">Agent commits marked as the agents'</text>

  <circle cx="60" cy="360" r="16" fill="#1E3A5F"/>
  <text x="60" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="95" y="366" font-size="16" fill="#1E3A5F" font-weight="700">Machine account tested; the plan corrected twice</text>

  <circle cx="60" cy="425" r="18" fill="#2E86AB"/>
  <text x="60" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
  <text x="95" y="431" font-size="16" fill="#2E86AB" font-weight="700">For now: agents prepare, I push and merge</text>
</svg>
