<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>One login, three actors: who holds which credential, before and after</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="627" fill="#0f172a"/>

  <text x="50" y="76" font-size="38" font-weight="800" fill="#f8fafc">One login, three actors</text>
  <text x="50" y="114" font-size="20" font-weight="500" fill="#94a3b8">Separating human, agent and CI credentials as a solo operator</text>

  <!-- Before -->
  <text x="50" y="170" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="1.5">BEFORE</text>
  <rect x="50" y="186" width="190" height="48" rx="8" fill="#1e293b"/>
  <text x="145" y="217" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Me</text>
  <rect x="50" y="246" width="190" height="48" rx="8" fill="#1e293b"/>
  <text x="145" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Agents</text>
  <rect x="50" y="306" width="190" height="48" rx="8" fill="#1e293b"/>
  <text x="145" y="337" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">CI workflows</text>

  <line x1="242" y1="210" x2="345" y2="258" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="242" y1="270" x2="345" y2="270" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="242" y1="330" x2="345" y2="282" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="350" y="226" width="200" height="88" rx="10" fill="#475569"/>
  <text x="450" y="266" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">One GitHub</text>
  <text x="450" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">login</text>
  <text x="300" y="400" text-anchor="middle" font-size="18" font-style="italic" fill="#94a3b8">The platform sees one actor</text>

  <line x1="600" y1="160" x2="600" y2="560" stroke="#334155" stroke-width="2"/>

  <!-- After -->
  <text x="650" y="170" font-size="16" font-weight="700" fill="#7dd3fc" letter-spacing="1.5">AFTER</text>
  <rect x="650" y="186" width="500" height="80" rx="10" fill="#7dd3fc" fill-opacity="0.12"/>
  <text x="672" y="218" font-size="21" font-weight="700" fill="#7dd3fc">Me</text>
  <text x="672" y="248" font-size="17" fill="#cbd5e1">My login, behind a password manager and a fingerprint</text>
  <rect x="650" y="282" width="500" height="80" rx="10" fill="#a78bfa" fill-opacity="0.12"/>
  <text x="672" y="314" font-size="21" font-weight="700" fill="#c4b5fd">Agents</text>
  <text x="672" y="344" font-size="17" fill="#cbd5e1">Own identity, read-only, prepare branches; no write</text>
  <rect x="650" y="378" width="500" height="80" rx="10" fill="#fbbf24" fill-opacity="0.12"/>
  <text x="672" y="410" font-size="21" font-weight="700" fill="#fcd34d">CI</text>
  <text x="672" y="440" font-size="17" fill="#cbd5e1">Short-lived credentials where offered; deploy only</text>

  <text x="50" y="560" font-size="24" font-weight="700" fill="#f8fafc">Agents prepare. I push and merge. CI deploys.</text>
  <text x="1150" y="600" text-anchor="end" font-size="16" fill="#64748b">impacteng.com.au</text>
</svg>
