<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <rect width="1200" height="627" fill="#0f172a"/>

  <!-- Title -->
  <text x="50" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">A shared AI platform, from the first request</text>
  <text x="50" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">to the twentieth app</text>
  <text x="50" y="146" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">In an APRA-regulated organisation. Fourteen posts, one path.</text>

  <!-- Row 1 -->
  <rect x="50" y="178" width="340" height="160" rx="10" fill="#fbbf24" fill-opacity="0.08"/>
  <text x="72" y="216" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#fcd34d">1  A request arrives</text>
  <text x="72" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Is it part of a critical</text>
  <text x="72" y="274" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">operation? Then it may not</text>
  <text x="72" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">be a pilot.</text>

  <text x="406" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#475569">&gt;</text>

  <rect x="430" y="178" width="340" height="160" rx="10" fill="#a78bfa" fill-opacity="0.08"/>
  <text x="452" y="216" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#c4b5fd">2  The door</text>
  <text x="452" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Six questions decide what</text>
  <text x="452" y="274" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">gets built before a team</text>
  <text x="452" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">gets access.</text>

  <text x="786" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#475569">&gt;</text>

  <rect x="810" y="178" width="340" height="160" rx="10" fill="#60a5fa" fill-opacity="0.08"/>
  <text x="832" y="216" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#93c5fd">3  Where data goes</text>
  <text x="832" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Set per type of data.</text>
  <text x="832" y="274" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Tested: the hole in my</text>
  <text x="832" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">own residency policy.</text>

  <!-- Row 2 -->
  <rect x="50" y="366" width="340" height="160" rx="10" fill="#2dd4bf" fill-opacity="0.08"/>
  <text x="72" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#5eead4">4  One way in</text>
  <text x="72" y="438" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">No other path to a model,</text>
  <text x="72" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">no emergency bypass.</text>
  <text x="72" y="486" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Fail closed.</text>

  <text x="406" y="454" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#475569">&gt;</text>

  <rect x="430" y="366" width="340" height="160" rx="10" fill="#f97316" fill-opacity="0.08"/>
  <text x="452" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#fb923c">5  Who spent it</text>
  <text x="452" y="438" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Tested: billing names the</text>
  <text x="452" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">team, but only by the day.</text>
  <text x="452" y="486" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Meter every request.</text>

  <text x="786" y="454" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#475569">&gt;</text>

  <rect x="810" y="366" width="340" height="160" rx="10" fill="#10b981" fill-opacity="0.08"/>
  <text x="832" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#34d399">6  The twentieth app</text>
  <text x="832" y="438" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Scale by triggers, not</text>
  <text x="832" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">the calendar. Watch the</text>
  <text x="832" y="486" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">queue before the route-around.</text>

  <!-- Footer -->
  <line x1="50" y1="568" x2="1150" y2="568" stroke="#3f3f46" stroke-width="1"/>
  <text x="600" y="598" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8" font-weight="500" text-anchor="middle">nitin@impacteng.com.au</text>
</svg>
